[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search"
version = "2.0.0"
description = "Self-hosted, MCP-native web-search backend for AI agents: SearXNG meta-search + RAG with citations + GitHub project selection + Tavily-compatible API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "searxng", "rag", "web-search", "llm-tools", "agent", "tavily", "self-hosted"]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "mcp[cli]>=1.2",
]

[project.optional-dependencies]
extract = ["trafilatura>=1.12.2,<2.0"]   # 更强正文抽取 / better extraction
deep = ["crawl4ai>=0.9"]          # JS 渲染深抓 / JS-rendered deep crawl
rerank = ["flashrank>=0.2"]       # 可选二阶段重排 / optional rerank

[project.scripts]
agent-search = "search:main"            # CLI: search / --answer / --extract / --map
agent-search-mcp = "mcp_server:main"    # MCP stdio server
agent-search-server = "server:main"     # HTTP API (FastAPI)

[tool.setuptools]
py-modules = ["search", "server", "mcp_server"]
