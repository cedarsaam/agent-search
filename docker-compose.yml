services:
  searxng:
    image: searxng/searxng:latest
    container_name: agent-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/engines/doubao.py:/usr/local/searxng/searx/engines/doubao.py:ro
      - ./data:/etc/searxng/data:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SESSION_TIMEOUT=300
      # 用 .env 的 SEARXNG_SECRET_KEY 覆盖占位 secret（强烈建议设置）
      # Override the placeholder secret with SEARXNG_SECRET_KEY from .env (recommended)
      - SEARXNG_SECRET=${SEARXNG_SECRET_KEY:-ultrasecretkey}
      # 豆包搜索 engine 用的 key（可选，从项目 .env 注入 / optional）
      - WEB_SEARCH_API_KEY=${WEB_SEARCH_API_KEY:-}
      # Agent Search 专用出站代理：只影响本 compose 内的 SearXNG，不改系统网络
      - HTTP_PROXY=${AGENT_SEARCH_OUTBOUND_PROXY:-}
      - HTTPS_PROXY=${AGENT_SEARCH_OUTBOUND_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,agent-searxng,agent-flaresolverr
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: agent-flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
      # Agent Search 专用出站代理：只影响本 compose 内的 FlareSolverr，不改系统网络
      - HTTP_PROXY=${AGENT_SEARCH_OUTBOUND_PROXY:-}
      - HTTPS_PROXY=${AGENT_SEARCH_OUTBOUND_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,agent-searxng,agent-flaresolverr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
